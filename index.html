<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anime Power Selector</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <h2>Choose Your Anime Power ⚡🔥❄️</h2>
  <div class="card" id="powerCard">
    <div class="aura" id="auraEffect"></div>
    <strong id="selectedPower">Select a Power</strong>
  </div>

  <label for="powerSelector">Choose a power:</label>
  <select id="powerSelector">
    <option value="">-- Select Power --</option>
    <option value="fire">🔥 Fire</option>
    <option value="ice">❄️ Ice</option>
    <option value="lightning">⚡ Lightning</option>
    <option value="earth">🌍 Earth</option>
    <option value="wind">💨 Wind</option>
    <option value="water">💧 Water</option>
    <option value="darkness">🌑 Darkness</option>
  </select>

  <script src="script.js"></script>
</body>
</html>
